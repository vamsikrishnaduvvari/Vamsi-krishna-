services:
  jenkins:
    build: ./jenkins
    user: root
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/python-cicd/ec2-deploy-key.pem:/run/deploy-key/ec2-deploy-key.pem:ro
    restart: unless-stopped

volumes:
  jenkins_home:
